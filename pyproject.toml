[project]
name = "cosmo"
version = "0.1.0"
description = "Security review and zero-day discovery tool. Model-pluggable — Claude by default, any provider or a local model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Default model provider (§8). Absent → the LLM stage degrades gracefully to a no-op.
claude = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
cosmo = "cosmo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
