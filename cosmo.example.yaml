# cosmo.yaml — checked into the repo being scanned.
#
# TRUST TIERS (architecture §15/§16):
#   [pref]   repo overrides operator config
#   [safety] operator/org is the ceiling; a repo may only TIGHTEN these, never
#            loosen them. Loosening values are clamped back at config-load and a
#            warning is emitted. external_targets / disclosure / triggers are
#            operator-only and ignored here entirely.

threshold: medium                    # [pref]
ignore_paths:                        # [pref]
  - "vendor/**"
  - "**/*.generated.*"

skills:                              # [pref] — extra review guidance for the LLM stage
  # Repo skills live in .cosmo/skills/*.md and need no config. They are loaded
  # but injected as UNTRUSTED reference (RISK-03) — they cannot suppress findings.
  # org_dir: /etc/cosmo/skills       #   OPERATOR-ONLY: names the TRUSTED, authoritative
                                     #   skill library. A value here in a scanned repo is
                                     #   IGNORED + warned — otherwise a repo could promote
                                     #   its own skills and instruct the reviewer directly.

static:                              # [safety] — repo may ADD a scanner, never drop one
  tools: [semgrep, gitleaks, bandit, trivy, opengrep, trufflehog, find-sec-bugs]
  concurrency: 4                     #   scanner subprocesses in flight at once
  # trufflehog_verify: false         #   OPERATOR-ONLY: verification calls the
                                     #   credential's provider — egress the
                                     #   broker never sees. A repo value is
                                     #   ignored + warned.

providers:                           # [pref] — pick your model
  claude: { default: true }          #   built-ins: claude, claude-cli, codex,
  # codex:    { default: true }      #   deepseek, llama. Exactly one default.
  # deepseek: { default: true }      #   Per-run override: --model <name>.
  # on_failure: fallback              # fallback (to Claude) | hard_fail
                                     # Each provider's key/endpoint is fixed in
                                     # providers/registry.py, not configured here.

providers_policy:                    # [safety] — repo may only RAISE sensitivity
  data_sensitivity: normal           #   'sensitive' blocks off-box providers...
  # sensitive_allowed_vendors: []    #   ...except vendors the operator lists here (operator-only)

incremental:                         # [pref] — cache expensive stages between scans
  enabled: true                      #   set false (or --no-cache) to force a full re-scan

llm_audit:                           # [safety] — tighten only
  max_files: 50                      #   files one whole-project audit sends to the model
  concurrency: 4                     #   reviews in flight at once; may lower, never raise

history:                             # [safety] — tighten only
  max_commits: 200                   #   commits one `cosmo history` sweep reviews
                                     #   (one model call each — the sharpest cost cap)

sandbox:                             # [safety] — tighten only
  network: none                      #   may stay 'none'; cannot open to bridge/host
  timeout_seconds: 120               #   may lower below the operator ceiling; cannot raise

fuzzing:                             # [safety] — tighten only
  max_duration: "2h"                 #   may lower; cannot raise past the operator ceiling

# extensions:                        # [safety] — OPERATOR-ONLY. A block here in a
#   paths: ["..."]                   #   scanned repo is IGNORED + warned: a repo can
#   enabled: ["my-ext"]              #   never enable an extension. Set these in the
#   reference_only: ["my-ext"]       #   operator config instead. See docs/EXTENSIONS.md.
